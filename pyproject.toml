[project]
name = "clubsteward"
version = "0.1.0"
description = "AI email agent for club volunteers — nightly inbox triage, member register care, reply drafts, human-in-the-loop decisions."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "strands-agents[litellm]>=1.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
