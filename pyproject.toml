[project]
name = "clubsteward"
version = "0.1.0"
description = "AI email agent for club volunteers — nightly inbox triage, member register care, reply drafts, human-in-the-loop decisions."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "strands-agents[litellm]>=1.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E4/E7/E9 = pycodestyle errors, F = pyflakes, I = import sorting,
# B = bugbear, RUF = ruff-specific (noqa hygiene), UP = pyupgrade
select = ["E4", "E7", "E9", "F", "I", "B", "RUF", "UP"]
ignore = [
    "B008",   # function-call-in-default-arg is the FastAPI Depends() idiom
    "UP042",  # str+Enum -> StrEnum would change str() semantics of Intent/Action
]
