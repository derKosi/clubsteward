name: tests

# Runs on demand only: manual dispatch, version tags, or published releases.
# Deliberately NOT on every push or PR — commits stay quiet.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest tests/ -q
      - run: uv run python scripts/reset_demo.py
      - run: bash -n demo/run_demo.sh
      - run: bash -n scripts/run_web.sh
