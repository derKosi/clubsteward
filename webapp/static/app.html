<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClubSteward Console</title>
<style>
  :root { --ink:#0f172a; --mut:#64748b; --bg:#f1f5f9; --card:#fff; --brand:#0f766e; --warn:#b45309; --ok:#15803d; --bad:#b91c1c; }
  * { box-sizing:border-box; margin:0; padding:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { background:var(--bg); color:var(--ink); }
  .top { background:var(--ink); color:#fff; padding:12px 20px; display:flex; align-items:center; gap:16px; }
  .top .logo { font-weight:800; } .top .logo span { color:#5eead4; }
  .top a { color:#cbd5e1; text-decoration:none; font-size:13.5px; }
  .wrap { max-width:1080px; margin:0 auto; padding:20px 24px 60px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .chip { background:var(--card); border:1px solid #e2e8f0; border-radius:999px; padding:8px 14px; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--mut); }
  .chip.on { color:#fff; border-color:transparent; box-shadow:0 2px 8px rgba(2,6,23,.18); }
  .row { display:grid; grid-template-columns: 5fr 4fr; gap:16px; }
  .card { background:var(--card); border:1px solid #e2e8f0; border-radius:16px; padding:18px; margin-bottom:14px; }
  .card h3 { font-size:15px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .count { background:#e2e8f0; color:#475569; border-radius:999px; padding:1px 9px; font-size:12px; font-weight:700; }
  .kpi { display:flex; gap:10px; margin-bottom:14px; }
  .kpi .b { flex:1; background:var(--card); border:1px solid #e2e8f0; border-radius:14px; padding:12px; text-align:center; }
  .kpi b { font-size:22px; display:block; } .kpi span { color:var(--mut); font-size:12px; }
  .kpi .b.hot { border-color:#fecaca; background:#fff8f8; } .kpi .b.hot b { color:var(--bad); }
  .kpi .acts-box { display:flex; flex-direction:column; gap:8px; justify-content:center; }
  button { border:none; border-radius:10px; padding:12px 18px; font-weight:700; cursor:pointer; font-size:14px; transition:filter .15s, transform .06s; }
  button:hover { filter:brightness(1.07); } button:active { transform:scale(.98); }
  .btn-run { background:var(--brand); color:#fff; }
  .btn-app { background:var(--ok); color:#fff; } .btn-deny { background:#fee2e2; color:var(--bad); }
  .btn-edit { background:#fef3c7; color:var(--warn); }
  .btn-ghost { background:#fff; border:1px solid #e2e8f0; color:var(--mut); }
  .btn-up { background:var(--ink); color:#fff; text-align:center; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .sm { padding:8px 14px; font-size:13px; }
  .dec { border:1px solid #e2e8f0; border-radius:14px; padding:20px; margin-bottom:12px; background:#fff; word-break:break-word; }
  .dec h4 { font-size:17px; margin-bottom:6px; word-break:break-word; }
  .dec .meta { color:var(--mut); font-size:13px; margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .chipi { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; font-weight:600; background:#f1f5f9; border:1px solid #e2e8f0; color:#475569; border-radius:6px; padding:1px 7px; }
  .conf { border-radius:999px; padding:1px 9px; font-size:11.5px; font-weight:700; }
  .conf.hi { background:#dcfce7; color:var(--ok); } .conf.mid { background:#fef9c3; color:#a16207; } .conf.lo { background:#fee2e2; color:var(--bad); }
  .when { color:#94a3b8; }
  .sum { font-size:14px; color:#334155; margin:2px 0 10px; line-height:1.5; }
  .prop { background:#f0fdfa; border-left:3px solid var(--brand); padding:10px 14px; border-radius:0 10px 10px 0; margin:8px 0; }
  .prop label { display:block; font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--brand); margin-bottom:3px; }
  .prop p { font-size:14px; color:#134e4a; line-height:1.5; }
  .facts { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:5px 20px; background:#f8fafc; border:1px solid #eef2f7; border-radius:10px; padding:10px 14px; margin:8px 0; }
  .facts .f { display:flex; gap:10px; font-size:12.5px; } .facts .f span { color:var(--mut); min-width:130px; flex:none; } .facts .f b { color:#334155; font-weight:600; word-break:break-word; }
  .dec .why { background:#fffbeb; border-left:3px solid var(--warn); padding:9px 12px; font-size:13.5px; margin:10px 0; border-radius:0 8px 8px 0; color:#78350f; line-height:1.5; }
  details.mail { margin:12px 0 2px; } details.mail summary { cursor:pointer; font-size:13px; font-weight:600; color:var(--mut); user-select:none; }
  details.mail summary:hover { color:var(--ink); } details.mail[open] summary { margin-bottom:8px; }
  .dec .body { background:#f8fafc; border:1px solid #eef2f7; padding:12px; font-size:13.5px; white-space:pre-wrap; max-height:300px; overflow:auto; border-radius:8px; color:#334155; line-height:1.55; }
  .badge { background:#b91c1c; color:#fff; border-radius:999px; padding:2px 10px; font-size:13px; font-weight:700; margin-left:8px; }
  .flag { background:#ede9fe; color:#6d28d9; border-radius:6px; padding:1px 7px; font-size:11px; font-weight:700; margin-left:6px; vertical-align:2px; }
  .dec .acts { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .working { color:var(--mut); font-size:13.5px; font-weight:600; display:inline-flex; gap:8px; align-items:center; }
  .instruct { margin-top:12px; display:flex; flex-direction:column; gap:8px; background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:10px; }
  .instruct[hidden] { display:none; }
  .instruct textarea { width:100%; border:1px solid #e2e8f0; border-radius:8px; padding:8px 10px; font:inherit; font-size:13.5px; resize:vertical; }
  .ins-btns { display:flex; gap:8px; }
  .zero { text-align:center; padding:26px 0 16px; }
  .zero .z1 { font-size:30px; } .zero b { display:block; margin-top:6px; font-size:15px; } .zero span { color:var(--mut); font-size:13px; }
  .draft { border-bottom:1px solid #eef2f7; padding:10px 0; font-size:13px; }
  .draft:last-child { border-bottom:none; }
  .draft b { display:block; word-break:break-word; } .draft span { color:var(--mut); }
  .draft p { margin-top:4px; color:#334155; font-size:12.5px; white-space:pre-wrap; max-height:80px; overflow:hidden; }
  .draft-pair { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; border-bottom:1px solid #eef2f7; padding:12px 0; font-size:13px; }
  .draft-pair:last-child { border-bottom:none; }
  .draft-pair b { display:block; word-break:break-word; }
  .draft-pair .mut { color:var(--mut); font-size:12px; }
  .draft-pair p { margin-top:4px; font-size:12.5px; white-space:pre-wrap; max-height:150px; overflow:auto; color:#334155; }
  .draft-src { background:#f8fafc; border:1px solid #eef2f7; border-radius:8px; padding:8px 10px; }
  .draft-out { border-left:3px solid var(--pri, #15803d); background:#fff; border-radius:8px; padding:8px 10px; }
  @media (max-width:820px){ .draft-pair { grid-template-columns:1fr; gap:10px; } }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; color:var(--mut); font-weight:600; padding:6px 8px; border-bottom:1px solid #e2e8f0; }
  td { padding:6px 8px; border-bottom:1px solid #f1f5f9; }
  .log { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; white-space:pre-wrap; max-height:220px; overflow:auto; background:#0f172a; color:#cbd5e9; padding:12px; border-radius:10px; }
  .spin { animation:sp 1s linear infinite; display:inline-block; } @keyframes sp { to { transform:rotate(360deg);} }
  #toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(8px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:50; box-shadow:0 8px 24px rgba(2,6,23,.28); border-left:4px solid #94a3b8; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.ok { border-left-color:#22c55e; } #toast.bad { border-left-color:#ef4444; }
  @media (max-width:820px){ .row{grid-template-columns:1fr} .kpi{flex-wrap:wrap} }
  .card, .kpi { scroll-margin-top:16px; }
</style>
</head>
<body>
<div class="top">
  <div class="logo">Club<span>Steward</span> · Console</div>
  <a href="/">← product page</a>
</div>
<div class="wrap">
  <div class="bar" id="clubs"></div>

  <div class="kpi" id="kpis">
    <div class="b"><b>—</b><span>inbox</span></div>
    <div class="b" id="kpiDec"><b>—</b><span>pending decisions</span></div>
    <div class="b"><b>—</b><span>drafts ready to send</span></div>
    <div class="b acts-box">
      <button class="btn-up sm" id="resetBtn" style="cursor:pointer;">↺ Reset &amp; run live</button>
      <button class="btn-run" id="runBtn">🌙 Run night</button>
      <label class="btn-up sm" style="cursor:pointer;">📥 Drop .eml into inbox
        <input type="file" accept=".eml" multiple id="upFiles" style="display:none">
      </label>
    </div>
  </div>

  <div class="card" id="decisions">
    <h3>⚖️ Decisions for you <span id="decCount"></span></h3>
    <div id="decList"><p style="color:var(--mut);font-size:13px">No pending decisions.</p></div>
  </div>

  <div class="row">
    <div style="min-width:0">
      <div class="card" id="runlogCard">
        <h3>🌙 Night run log</h3>
        <div class="log" id="runlog">— run the night to see the agent work —</div>
      </div>
      <div class="card" id="outbox">
        <h3>📤 Outbox drafts <span class="count" id="draftCount">0</span> <span style="color:var(--mut);font-weight:500;font-size:12.5px">review before sending</span></h3>
        <div id="drafts"></div>
      </div>
    </div>
    <div style="min-width:0">
      <div class="card" id="register">
        <h3>👥 Member register</h3>
        <div style="overflow:auto"><table id="reg"></table></div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
let CLUB = null, clubs = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pretty = k => k.replace(/_/g,' ').replace(/^\w/, c=>c.toUpperCase());

function toast(msg, kind=''){
  const t = $('toast'); t.textContent = msg; t.className = 'show ' + kind;
  clearTimeout(toast.timer); toast.timer = setTimeout(()=> t.className='', 2600);
}
function relTime(iso){
  if(!iso) return '';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if(isNaN(s) || s < 0) return '';
  if(s < 90) return 'just now';
  if(s < 3600) return Math.round(s/60) + ' min ago';
  if(s < 172800) return Math.round(s/3600) + ' h ago';
  if(s < 1209600) return Math.round(s/86400) + ' d ago';
  return new Date(iso).toLocaleDateString();
}

async function loadClubs(){
  clubs = await (await fetch('/api/clubs')).json();
  $('clubs').innerHTML = clubs.map(c =>
    `<div class="chip ${c.id===CLUB?'on':''}" data-id="${esc(c.id)}" style="${c.id===CLUB?`background:${esc(c.color)};`:''}" onclick="pick('${esc(c.id)}')">${esc(c.name)}</div>`).join('');
}
function pick(id){
  CLUB = id;
  history.replaceState(null, '', `/app?club=${encodeURIComponent(id)}${location.hash}`);
  loadClubs(); loadState(); loadDecisions();
}

async function loadState(){
  if(!CLUB) return;
  const s = await (await fetch(`/api/clubs/${CLUB}/state`)).json();
  $('kpis').children[0].querySelector('b').textContent = s.inbox.length;
  $('kpis').children[1].querySelector('b').textContent = s.decisions_pending;
  $('kpiDec').classList.toggle('hot', s.decisions_pending > 0);
  $('kpis').children[2].querySelector('b').textContent = s.drafts.length;
  $('draftCount').textContent = s.drafts.length;
  $('drafts').innerHTML = s.drafts.length ? s.drafts.map(d=>{
    const src = d.source;
    const srcHtml = src
      ? `<b>${esc(src.subject)}</b><span class="mut">from ${esc(src.from)}</span><p>${esc(src.body.slice(0,420))}${src.body.length>420?'…':''}</p>`
      : '<p style="color:var(--mut)">no matching incoming mail in processed/</p>';
    return `<div class="draft-pair">
      <div class="draft-src"><span class="mut">📥 Incoming</span>${srcHtml}</div>
      <div class="draft-out"><span class="mut">✉️ Draft</span><b>${esc(d.subject || d.file.replace(/^draft_/,'').replace(/\.eml$/,'').replace(/_/g,' '))}</b><span class="mut">to ${esc(d.to)}</span><p>${esc(d.body.slice(0,420))}…</p></div>
    </div>`;
  }).join('')
    : '<p style="color:var(--mut);font-size:13px">No drafts yet.</p>';
  const reg = s.register;
  if(reg.length){
    const cols = Object.keys(reg[0]);
    $('reg').innerHTML = `<tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>` +
      reg.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]||'')}</td>`).join('')}</tr>`).join('');
  }
}

async function loadDecisions(){
  if(!CLUB) return;
  const ds = await (await fetch(`/api/clubs/${CLUB}/decisions`)).json();
  $('decCount').innerHTML = ds.length ? `<span class="badge">${ds.length} pending</span>` : '';
  $('decList').innerHTML = ds.length ? ds.map(d=>{
    const pct = Math.round((d.confidence||0)*100);
    const cls = pct>=90 ? 'hi' : pct>=75 ? 'mid' : 'lo';
    const flags = (d.flags||[]).map(f=>`<span class="flag">${esc(f)}</span>`).join('');
    const facts = d.details && Object.keys(d.details).length
      ? `<div class="facts">${Object.entries(d.details).map(([k,v])=>
          `<div class="f"><span>${esc(pretty(k))}</span><b>${esc(Array.isArray(v)?v.join(' · '):String(v))}</b></div>`).join('')}</div>`
      : '';
    return `
    <div class="dec" id="dec-${esc(d.id)}">
      <h4>${esc(d.subject)}${flags}</h4>
      <div class="meta">
        <span class="chipi">${esc(d.intent)}</span>
        <span class="conf ${cls}">${pct}% sure</span>
        <span>from ${esc(d.from)}</span>
        <span class="when" title="${esc(d.created_at||'')}">· ${relTime(d.created_at)}</span>
      </div>
      <div class="sum">💡 ${esc(d.summary)}</div>
      <div class="prop"><label>Agent proposes</label><p>${esc(d.proposed)}</p></div>
      ${facts}
      <div class="why"><b>Why you:</b> ${esc(String(d.policy_reason||'').replace(/^Policy:\s*/,''))}</div>
      <details class="mail"><summary>Show original mail</summary><div class="body">${esc(d.mail_body)}</div></details>
      <div class="acts">
        <button class="btn-app" onclick="act('${esc(d.id)}','approve')">✓ Approve</button>
        <button class="btn-edit" onclick="toggleIns('${esc(d.id)}')">✎ Approve + instruct</button>
        <button class="btn-deny" onclick="act('${esc(d.id)}','deny')">✕ Deny</button>
      </div>
      <div class="instruct" id="ins-${esc(d.id)}" hidden>
        <textarea id="tx-${esc(d.id)}" rows="2" placeholder="Instructions for the agent — e.g. “offer the seniors rate and confirm instalments”"></textarea>
        <div class="ins-btns">
          <button class="btn-app sm" onclick="act('${esc(d.id)}','approve', document.getElementById('tx-${esc(d.id)}').value)">✓ Approve with instructions</button>
          <button class="btn-ghost sm" onclick="toggleIns('${esc(d.id)}')">Cancel</button>
        </div>
      </div>
    </div>`;}).join('')
  : `<div class="zero"><div class="z1">🎉</div><b>Inbox zero — nothing needs a human right now.</b><span>Run the night again after new mail arrives.</span></div>`;
}

function toggleIns(id){
  const el = $('ins-'+id); el.hidden = !el.hidden;
  if(!el.hidden) $('tx-'+id).focus();
}

async function act(id, action, instructions=''){
  const card = $('dec-'+id);
  if(card) card.querySelector('.acts').outerHTML =
    `<div class="acts"><span class="working"><span class="spin">◌</span> ${action==='deny' ? 'filing mail without reply…' : 'the agent is executing — drafting the reply, updating the register…'}</span></div>`;
  try {
    await fetch(`/api/clubs/${CLUB}/decisions/${id}/${action}`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({instructions})});
    toast(action==='deny' ? '✕ Denied — mail filed without reply'
         : instructions ? '✓ Approved with your instructions — done'
         : '✓ Approved — the agent has executed it', action==='deny' ? 'bad' : 'ok');
  } catch(e) { toast('Something went wrong — try again', 'bad'); }
  loadState(); loadDecisions();
}

let runningHere = false;
$('runBtn').onclick = async ()=>{
  if(!CLUB) return;
  if(runningHere){  // second click while the night runs = stop after the current mail
    await fetch(`/api/clubs/${CLUB}/stop`, {method:'POST'});
    $('runBtn').innerHTML = '<span class="spin">◌</span> stopping…';
    return;
  }
  runningHere = true;
  $('runBtn').innerHTML = '⏹ Stop';
  await fetch(`/api/clubs/${CLUB}/run`, {method:'POST'});
  const poll = setInterval(async ()=>{
    const st = await (await fetch(`/api/clubs/${CLUB}/run/status`)).json();
    if(st.log && st.log.length){ const el = $('runlog'); el.textContent = st.log.join('\n'); el.scrollTop = el.scrollHeight; }
    if(!st.running){
      clearInterval(poll); runningHere = false;
      $('runBtn').textContent = '🌙 Run night';
      toast(st.log.some(l => l.includes('Stop requested')) ? '⏹ Stopped — remaining mails stay in the inbox' : '🌙 Night run finished','ok');
      loadState(); loadDecisions();
    }
  }, 2000);
};

$('resetBtn').onclick = async ()=>{
  if(!CLUB) return;
  if(!confirm('Reset this club to its starting corpus?\nClears inbox/outbox/decisions/processed/sessions — then the night run starts live.')) return;
  $('resetBtn').disabled = true; $('resetBtn').innerHTML = '<span class="spin">◌</span> resetting…';
  try {
    const r = await fetch(`/api/clubs/${CLUB}/reset`, {method:'POST'});
    if(!r.ok) throw new Error(await r.text());
    const j = await r.json();
    toast(`↺ Reset — ${j.inbox} mails back in the inbox`, 'ok');
    loadState(); loadDecisions();
    $('runBtn').click();
  } catch(e) { toast('Reset failed — is a run in progress?', 'bad'); }
  $('resetBtn').disabled = false; $('resetBtn').textContent = '↺ Reset & run live';
};

$('upFiles').onchange = async (e)=>{
  for(const f of e.target.files){
    const fd = new FormData(); fd.append('file', f);
    await fetch(`/api/clubs/${CLUB}/inbox`, {method:'POST', body: fd});
  }
  toast(`📥 ${e.target.files.length} mail${e.target.files.length===1?'':'s'} dropped into the inbox`, 'ok');
  e.target.value=''; loadState();
};

(async ()=>{
  await loadClubs();
  const want = new URLSearchParams(location.search).get('club');
  if(want && clubs.some(c=>c.id===want)) pick(want);
  else if(!CLUB && clubs.length) pick(clubs[0].id);
})();
</script>
</body>
</html>
