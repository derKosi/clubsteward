<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- zones -->
  <rect x="200" y="64" width="440" height="466" rx="16" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="420" y="92" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1.5" fill="#0f766e">STRANDS AGENTS SDK</text>

  <rect x="676" y="64" width="300" height="492" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="826" y="92" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1.5" fill="#64748b">ON THE CLUB'S MACHINE</text>
  <text x="692" y="118" font-size="10" font-weight="800" letter-spacing="1.2" fill="#c2410c">HUMAN IN THE LOOP</text>
  <text x="692" y="326" font-size="10" font-weight="800" letter-spacing="1.2" fill="#15803d">AUTOMATED OVERNIGHT ✓</text>

  <!-- policy.yaml chip -->
  <rect x="232" y="110" width="170" height="56" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="5 3"/>
  <text x="317" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">policy.yaml</text>
  <text x="317" y="152" text-anchor="middle" font-size="11" fill="#b45309">the club's own rules</text>

  <!-- inbox -->
  <rect x="28" y="196" width="148" height="110" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="102" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">📥 Club inbox</text>
  <text x="102" y="260" text-anchor="middle" font-size="11.5" fill="#64748b">member mails —</text>
  <text x="102" y="277" text-anchor="middle" font-size="11.5" fill="#64748b">any club, any language</text>

  <!-- triage -->
  <rect x="232" y="200" width="170" height="110" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="317" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">🔍 Triage agent</text>
  <text x="317" y="256" text-anchor="middle" font-size="11.5" fill="#64748b">structured output:</text>
  <text x="317" y="273" text-anchor="middle" font-size="11.5" fill="#64748b">intent · facts · flags</text>
  <text x="317" y="290" text-anchor="middle" font-size="11.5" fill="#64748b">confidence</text>

  <!-- policy gate -->
  <rect x="452" y="200" width="160" height="110" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="532" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">⚖️ Policy gate</text>
  <text x="532" y="256" text-anchor="middle" font-size="11.5" fill="#64748b">auto / ask / reject</text>
  <text x="532" y="273" text-anchor="middle" font-size="11.5" fill="#64748b">+ ask_if flags</text>
  <text x="532" y="290" text-anchor="middle" font-size="11.5" fill="#64748b">min_confidence</text>

  <!-- spam chip -->
  <rect x="490" y="336" width="140" height="40" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="560" y="361" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">🗑 discarded</text>

  <!-- act agent -->
  <rect x="232" y="400" width="170" height="110" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="317" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">🛠️ Act agent</text>
  <text x="317" y="452" text-anchor="middle" font-size="11.5" fill="#64748b">tool loop: register ·</text>
  <text x="317" y="469" text-anchor="middle" font-size="11.5" fill="#64748b">draft · log</text>
  <text x="317" y="490" text-anchor="middle" font-size="10.5" fill="#0f766e">memory: FileSessionManager</text>

  <!-- HITL -->
  <rect x="436" y="400" width="186" height="110" rx="12" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="529" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">🛡️ HumanInTheLoop</text>
  <text x="529" y="454" text-anchor="middle" font-size="11.5" fill="#0e7490">SDK intervention</text>
  <text x="529" y="471" text-anchor="middle" font-size="11.5" fill="#0e7490">policy-driven classifier</text>
  <text x="529" y="492" text-anchor="middle" font-size="10.5" fill="#0e7490">unknown tools fail closed</text>

  <!-- right column: human loop -->
  <rect x="692" y="128" width="268" height="70" rx="12" fill="#fff" stroke="#fdba74"/>
  <text x="826" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">⚖️ Decisions for you</text>
  <text x="826" y="176" text-anchor="middle" font-size="11" fill="#64748b">original mail · agent proposal</text>
  <text x="826" y="192" text-anchor="middle" font-size="11" fill="#c2410c" font-weight="600">the exact reason a human decides</text>

  <rect x="692" y="224" width="268" height="56" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="826" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">👩‍💼 Sarah approves / instructs</text>
  <text x="826" y="268" text-anchor="middle" font-size="11" fill="#9a3412">web console · decide CLI</text>

  <!-- right column: automated -->
  <rect x="692" y="336" width="268" height="58" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="826" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">📤 Outbox drafts</text>
  <text x="826" y="380" text-anchor="middle" font-size="11" fill="#64748b">warm replies — reviewed before sending</text>

  <rect x="692" y="410" width="268" height="56" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="826" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">📋 Member register</text>
  <text x="826" y="454" text-anchor="middle" font-size="11" fill="#64748b">CSV — updated overnight</text>

  <rect x="692" y="482" width="268" height="56" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="826" y="506" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">📝 Activity log</text>
  <text x="826" y="526" text-anchor="middle" font-size="11" fill="#64748b">every action · tokens · ~€0.01/night</text>

  <!-- arrows -->
  <line x1="176" y1="253" x2="232" y2="253" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="204" y="244" text-anchor="middle" font-size="10.5" fill="#64748b">mail</text>

  <line x1="402" y1="255" x2="452" y2="255" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="427" y="246" text-anchor="middle" font-size="10.5" fill="#64748b">case</text>

  <path d="M470,310 L470,372 L317,372 L317,400" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <text x="400" y="364" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">auto ✓</text>

  <line x1="560" y1="310" x2="560" y2="336" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <text x="568" y="330" font-size="10.5" font-weight="700" fill="#b91c1c">reject</text>

  <line x1="612" y1="240" x2="692" y2="166" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arr-orange)"/>
  <text x="641" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#ea580c">ask</text>

  <line x1="622" y1="415" x2="692" y2="368" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <text x="655" y="400" text-anchor="middle" font-size="10.5" fill="#15803d">gated writes</text>
  <line x1="622" y1="445" x2="692" y2="438" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <line x1="622" y1="475" x2="692" y2="510" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr-green)"/>

  <path d="M960,252 L988,252 L988,610 L317,610 L317,510" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arr-orange)"/>
  <text x="560" y="602" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">approve + instruct — the agent executes</text>

  <path d="M402,138 L532,138 L532,200" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr-amber)"/>
  <text x="466" y="130" text-anchor="middle" font-size="10.5" fill="#b45309">drives routing + approvals</text>

  <line x1="402" y1="428" x2="436" y2="428" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="436" y1="484" x2="402" y2="484" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="419" y="416" text-anchor="middle" font-size="10" fill="#64748b">tool calls</text>

  <!-- footer caption -->
  <text x="28" y="624" font-size="11" fill="#94a3b8">Everything local — the only outbound call is mail text to the LLM. Drafts never send themselves; every action is logged.</text>
</svg>
